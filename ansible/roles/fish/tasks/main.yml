---

- name: Install the latest version of the fish shell
  ansible.builtin.package:
     name: fish
     status: present

- name: Set the login shell, for the {{ dev_user }} to use fish shell
  ansible.builtin.command: "chsh -s /usr/bin/fish {{ dev_user }}"

- name: Install the fish shell plugin manager "fisher"
  ansible.builtin.command: "curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher"

- name: Install the tide theme for fish shell
  ansible.builtin.command: "fisher install IlanCosman/tide@v6"
  
- name: Configure the tide theme
  ansible.builtin.command: "tide configure --auto --style=Rainbow --prompt_colors='True color' --show_time='12-hour format' --rainbow_prompt_separators=Slanted --powerline_prompt_heads=Sharp --powerline_prompt_tails=Flat --powerline_prompt_style='Two lines, character' --prompt_connection=Solid --powerline_right_prompt_frame=No --prompt_connection_andor_frame_color=Dark --prompt_spacing=Sparse --icons='Many icons' --transient=No"